[package]
name = "cellcode"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Carry an ascii string in terminal cells: symbol, foreground and background"

[dependencies]
tracing = { workspace = true }

[features]
# Nothing of its own: the switch exists so `#[cfg_attr(feature = "tracy", ..)]` on this
# crate's instrumentation has something to test, and the profiled build turns it on.
tracy = []
