[package]
name = "cell_map"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parse a terminal stream and hand each cell to a callback, in place"

[dependencies]
tracing = { workspace = true }
vt100 = { workspace = true }
# The rewriter reads and writes through async handles, so a caller hands it the pty's own
# stream and a sink with no blocking thread in between.
tokio = { workspace = true }

[features]
# Nothing of its own: the switch exists so `#[cfg_attr(feature = "tracy", ..)]` on this
# crate's instrumentation has something to test, and the profiled build turns it on.
tracy = []
