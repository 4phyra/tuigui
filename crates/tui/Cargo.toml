[package]
name = "tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Server side: run a command in a pty and paint remotely-sent frames onto the real terminal"

[dependencies]
wire = { workspace = true }
# The stream rewrite: cells of a registered surface are blanked on their way to the
# terminal, so the image behind them is visible.
cell_map = { workspace = true }
# A client's announcement as braille cells: the scan reads a run back into the string the
# transports already know how to parse.
cellcode = { workspace = true }
# `Default` on a type that wraps one: std's derive would reach into the tuple field by hand,
# where the wrapper's job is to be exactly that field's default.
better_default = { workspace = true }
# The screen the command is drawing into. Shared between the proxy that feeds it
# and the server that reads it, so there is one answer to "what is on screen".
vt100 = { workspace = true }
easytgp = { workspace = true }
image = { workspace = true }
rustix = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
# Retry, for reporting a failure to the client.
futures-retry = { workspace = true }
# One error type per failure instead of a string in an `io::Error`, so a caller can tell
# a dropped frame from a failed transmit.
thiserror = { workspace = true }

# The codec the server decodes with, behind the trait a codec can be swapped
# behind. Which codec it is arrives on the wire, and is not assumed here.
codecs = { workspace = true }
# `FuturesUnordered` and the `StreamExt` that reads it: every attached client is a
# future in one set, and whichever is ready is awaited directly instead of being
# polled in turn. Not already reachable through tokio.
futures-util = { version = "0.3", features = ["alloc"] }
# `ReaderStream`: the pty master is an `AsyncRead`, and the proxy consumes the
# command's output as chunks. The bridge is the crate's job, not a loop here.
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
# The anchor set, read by the rewrite and replaced by the server: a window opening
# reaches the next chunk without the rewrite waiting for it.
arc-swap = { workspace = true }
# Spans become zones in the Tracy profiler, for seeing where a frame's time goes.
tracing = { workspace = true }
# Diagnostics through the `log` facade, and a file capturer in the binary: a session's
# failures have nowhere else to go, because the pane is the screen and this process owns
# it.
log = { workspace = true }
# The profiler's client, optional and off by default: it is a compiled C++
# library with a background thread, and it is only worth carrying when a session
# is being profiled. `just trace` is what turns it on. `tracing` itself stays
# unconditional — a span with no subscriber is a no-op, so the instrumented code
# is the same code either way and a `tracy` build sees what actually runs.
tracing-tracy = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
default = []
tracy = ["dep:tracing-tracy", "dep:tracing-subscriber"]

[[bin]]
name = "tui"
path = "src/bin/tui.rs"
