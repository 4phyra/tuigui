[package]
name = "compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The session's windows: the programs running in a compositor of ours, drawn as panes"

[dependencies]
# A window draws itself into the pane through a shared reference, so a window is a
# `WidgetRef` rather than a `Widget` consumed by the draw.
ratatui = { workspace = true, features = ["unstable-widget-ref"] }
# What an event becomes for a window: W3C UI Events as data, and the physical
# pixel position they are expressed in.
ui-events = { workspace = true }
dpi = { workspace = true }
# The terminal's own event types: a window is pressed and typed into with the
# events the reader produced.
termina = { workspace = true }
# The terminal's report of its own size, which is the size a window's program is
# configured at.
rustix = { workspace = true }
# Diagnostics: a window that could not hand its frame on is a pane that stopped
# moving, and the reason has to be somewhere.
log = { workspace = true }
# Spans, for the frames this crate produces.
tracing = { workspace = true }
# The close button on a window's bar is the same cross a pane's furniture uses, and sharing it is
# what keeps the two from drifting apart.
tuigui_components = { workspace = true }
# What reaches a window and what it asks for: a size ask, the input it is typed with, and the
# windows it opens. Plain channels rather than a trait, so a window is a value the compositor
# holds without knowing who runs the program.
flume = { workspace = true }
# The `select!` that waits on the program and on the pane's events in one turn: a turn ends on
# whichever speaks first, and the two are not ordered against each other.
tokio = { workspace = true }

[dev-dependencies]
# The capybara demo images, decoded to pixels: what a dummy window paints its background from.
# `image` rather than a halftoning crate, which brought its own copy of every format, a gemini
# of glyph rasterisation and an HTTP client along to turn bytes into cells. The cells are the
# demo's own few lines instead (`dummy.rs`), and the format decoded is the one the set holds.
image = { workspace = true, features = ["jpeg"] }

[[example]]
name = "dummy"
path = "examples/dummy.rs"
