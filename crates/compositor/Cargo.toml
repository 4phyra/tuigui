[package]
name = "compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The session's windows: the programs running in a compositor of ours, drawn as panes"

[dependencies]
# A window draws itself into the pane through a shared reference, so a window is a
# `WidgetRef` rather than a `Widget` consumed by the draw.
ratatui = { workspace = true, features = ["unstable-widget-ref"] }
# What an event becomes for a window: W3C UI Events as data, and the physical
# pixel position they are expressed in.
ui-events = { workspace = true }
dpi = "0.1"
# The terminal's own event types: a window is pressed and typed into with the
# events the reader produced.
termina = { workspace = true }
# The terminal's report of its own size, which is the size a window's program is
# configured at.
rustix = { workspace = true }
# Diagnostics: a window that could not hand its frame on is a pane that stopped
# moving, and the reason has to be somewhere.
log = { workspace = true }
# Spans, for the frames this crate produces.
tracing = { workspace = true }
# The close button on a window's bar is the same cross a pane's furniture uses, and sharing it is
# what keeps the two from drifting apart.
tuigui_components = { workspace = true }

[dev-dependencies]
# The capybara demo image, converted to ANSI cells: what the dummy window draws.
halftone = { version = "0.10", default-features = false }

[[example]]
name = "dummy"
path = "examples/dummy.rs"
