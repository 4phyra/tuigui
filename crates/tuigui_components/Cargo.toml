[package]
name = "tuigui_components"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The widgets a pane is built from: a button, a tab strip, and the input they share"

[dependencies]
tracing = { workspace = true }
# The widgets themselves: each one draws into a buffer handed to it, and nothing here reaches
# for a terminal of its own.
ratatui = { workspace = true }
# The frame's input: the key and mouse events the pane's reader already produces.
termina = { workspace = true }
# The gallery's own terminal: raw mode is the device's, and it is not a widget's business.
rustix = { workspace = true }

[[bin]]
name = "gallery"
path = "src/bin/gallery.rs"

[dev-dependencies]
# The gallery as a user meets it: started in a real pty, sent one event at a
# time, and snapshotted after each. Default features, because the `insta` half
# of termlens is what turns a screen into a picture a reviewer can look at;
# the session suites at the root turn it off for their own dep.
termlens = "0.11"
