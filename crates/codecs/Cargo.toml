[package]
name = "codecs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The codec pair a session streams with, behind traits a codec can be swapped behind"

[dependencies]
# Hardware AV1 only, through the system's FFmpeg (linked statically from the
# dev shell / tuiguiBin build): the driver underneath — VAAPI, NVENC/CUVID,
# VideoToolbox — is what does the codec work, and there is no
# software fallback anywhere, tests included. `static` links FFmpeg's archives
# into our binary, so libav* is not a run-time dependency; `format` is enabled
# because ffmpeg-next's codec half does not build without it (its packet type
# names the avformat contexts); nothing here opens a container. No swscale, no
# resampler.
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "static"] }
# The JPEG pair: libjpeg-turbo, SIMD, linked via pkg-config against the dev
# shell's library. Chosen because it was the codec the project streamed with
# before AV1, and because a JPEG frame is a complete picture, which makes it
# the codec of least commitment for a pane that does not need temporal
# compression.
turbojpeg = { version = "1.5", default-features = false, features = ["pkg-config", "require-simd"] }
# One error type for both halves of the codec pair.
thiserror = { workspace = true }
# The codec id a session announces travels in a message archive, so it must be
# archivable itself.
rkyv = { workspace = true }
# The color conversions around the codec: B,G,R,A in, I420 to the codec, and
# back. SIMD, maintained by someone whose job it is.
yuvutils-rs = "0.8"
# Spans become zones in the Tracy profiler, for seeing where a frame's time
# goes; a span with no subscriber is a no-op, so the instrumented code is the
# same code either way.
tracing = { workspace = true }

[features]
# Nothing of its own: the switch exists so `#[cfg_attr(feature = "tracy", ..)]` on this
# crate's instrumentation has something to test, and the profiled build turns it on.
tracy = []
