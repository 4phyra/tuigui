[workspace]
resolver = "2"
members = [
    "crates/easytgp",
    "crates/wire",
    "crates/tui",
    "crates/gui",
    "crates/wayland",
    "crates/codecs",
    "crates/cell_map",
    "crates/cellcode",
    "crates/compositor",
    "crates/tuigui_components",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
thiserror = "2"
derive_builder = "0.20"
# `#[derive(Default)]`, with two things std's derive cannot do: a field's default given
# inline, and no `T: Default` bound for a `T` that is only a marker. That second one is why
# it is here: a struct generic over a type parameter it never stores — a widget naming the
# type of its state — is not `Default` under std's derive at all.
better_default = "1"
clap = { version = "4", features = ["derive", "env"] }
rustix = { version = "1.1", features = ["fs", "termios", "process", "pty", "net", "event"] }
png = "0.18"
image = "0.25"
fast_image_resize = { version = "6", features = ["rayon"] }
base64-turbo = "0.5"
itertools = "0.15"
idalloc = "0.1"
static_init = "1.0"
yscv-video = "0.2"
# Its default feature is the ffmpeg *downloader*, which drags in ureq ->
# rustls -> ring: a full TLS stack and a C build that this project never uses,
# since ffmpeg comes from the dev shell's PATH. Disabled, so the crate is just
# the subprocess plumbing we actually call.
ffmpeg-sidecar = { version = "2", default-features = false }
rstar = "0.13"
rayon = "1"
ndarray = "0.16"
# An inline viewport is written above with `Terminal::insert_before`. The `scrolling-regions`
# feature is what makes that path usable here: without it, `insert_before` finishes by clearing the
# viewport, and that clear asks the terminal where its cursor is — a reply that arrives on stdin,
# which this process's input reader thread owns, so it times out and the viewport is left unpainted.
# With the feature it scrolls the rows above the viewport instead and never asks.
ratatui = { version = "0.30", features = ["scrolling-regions"] }
# The terminal engine: parses a child's bytes into a grid and keeps the state a
# byte-level rewritter would have to track by hand.
vt100 = "0.18"
# Rewrites the cells of a terminal stream on its way to the screen. Here with the
# other workspace members so `wire` and `tui` agree on one version.
cell_map = { path = "crates/cell_map" }
# Carries a string in cells — symbol, foreground and background together — so an
# announcement costs a few columns instead of a whole line of text. Here with the
# other members so both halves of a session encode a record the same way.
cellcode = { path = "crates/cellcode" }
pollster = "0.4"
fxhash = "0.2"
crossterm = { version = "0.28", default-features = false, features = ["events"] }
# The terminal input parser: the gui client's reader thread feeds it the pane's
# raw bytes and reads typed events out, instead of parsing escapes by hand.
termina = "0.4"
derive_deref = "1.1"
derive-getters = "0.5"
derive_setters = "0.1"
sysinfo = "0.37"
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "renderer_pixman", "desktop", "xwayland"] }
wayland-protocols = { version = "0.32", features = ["client"] }
# `log` so a `tracing` event also reaches a `log` capturer. Every binary here
# installs the `log` facade, so without this an `info!` written through `tracing`
# — which is what the wayland crate uses — would go nowhere at all and the log
# would look like the code had never run.
tracing = { version = "0.1", features = ["log"] }
# The logging facade. A binary installs its own capturer, so which crate records a
# diagnostic is not the same decision as where it ends up.
# `std` for the boxed-logger entry point: without it a binary can only install a
# `&'static` logger, which a capturer holding a file cannot be.
log = { version = "0.4", features = ["std"] }
# Tracy: a `tracing` span becomes a profiler zone. A binary installs the
# subscriber, and the profiler it talks to is in the dev shell.
#
# Pinned, not ranged. Tracy's protocol is versioned and the profiler refuses a
# client that speaks a different one, so the crate that bundles the client and
# the profiler in the dev shell are one decision. `=0.11.4` resolves to
# `tracy-client-sys` 0.28.0, which bundles Tracy 0.13.x — the version nixpkgs
# ships and `flake.nix` puts in the dev shell. Bumping either alone breaks the
# link, so bump both or neither.
#
# Only what makes the client work. `system-tracing`, `context-switch-tracing`
# and `sampling` are on by default, and they record the kernel's context
# switches and call stacks for **every** process on the machine: a timeline
# crowded with unnamed threads belonging to everything else that is running,
# and sample columns standing where the real zones should be. The spans we care
# about stop being the picture and become the noise. A profile is for this
# program's threads.
tracing-subscriber = "0.3"
tracing-tracy = { version = "=0.11.4", default-features = false, features = [
    "enable",
    "broadcast",
    "callstack-inlines",
] }
# `signal` for SIGWINCH: the real terminal reports a resize by signalling, not by sending
# bytes, and the pty the command runs on has to be told the new size. `fs` for the pty's master:
# a plain `File` read would park a thread on it, and the reactor is what makes it a future.
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "process", "sync", "time", "macros", "signal", "fs"] }
# Retry, for the one message that must arrive: the report that something else failed. Chosen
# over `tokio-retry` because its handler sees each error, so an error that is plainly
# permanent can be passed on instead of retried.
futures-retry = "0.6"
# A queue that is read without ever being waited on, and is `Sync` as a plain value: a window
# hands its holder the children it has gained, and the holder takes them at its own pace.
flume = "0.11"
# Messages on the wire are rkyv archives of the enum's own shape: serialized
# into bytes, read back with validation. `bytecheck` is what validates an
# archive before it is trusted; without it a corrupted length would be a lie
# the decoder believes.
rkyv = { version = "0.8", features = ["alloc", "bytecheck"] }
# The buffer a program's output waits in while nobody can see it: one producer
# (the thread reading the pipe) and one consumer (the frame that prints). It has
# to be bounded, because a program that writes faster than it is read would
# otherwise be a program that grows this process without limit.
ringbuf = "0.6"
# The second transport: QUIC between two endpoints identified by a public key,
# with hole punching and a relay fallback underneath. Chosen over hand-rolled
# UDP because a session has to survive NAT, and over plain ssh because the
# channel has to be dialable from the side that did not start it.
#
# `default-features = false` drops `portmapper` (UPnP/NAT-PMP, a second set of
# sockets and a daemon to talk to) and keeps `tls-ring`, which is the QUIC
# handshake itself. Relay and hole punching are what this is here for; nothing
# else is.
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
# The string an endpoint's address becomes. A ticket is how an `EndpointAddr`
# crosses a channel that carries text: base32 after a kind prefix, which is
# exactly the shape an announcement already has.
iroh-tickets = "1"

# internal
easytgp = { path = "crates/easytgp" }
codecs = { path = "crates/codecs" }
compositor = { path = "crates/compositor" }
wire = { path = "crates/wire" }
tui = { path = "crates/tui" }
gui = { path = "crates/gui" }
wayland = { path = "crates/wayland" }
# The widgets a pane is built from: a button and a tab strip, drawn as plain ratatui widgets
# and handed one frame's input. Kept apart from `compositor` so the chrome around a window and
# the furniture inside a pane do not have to be one crate.
tuigui_components = { path = "crates/tuigui_components" }
# The input vocabulary both halves share: W3C UI Events as data, and the table
# that turns a physical key into each platform's own number. Pure Rust, no C.
ui-events = "0.3"
keycode = "1"

[package]
name = "tuigui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Run the tui server and a gui client as a single unit"

[features]
default = []
# Profile the session. Forwards to the two halves, which are the ones that
# install the subscriber — this crate only starts them. `just trace` builds
# with it; a plain build links no profiler at all.
tracy = ["tui/tracy", "gui/tracy", "dep:log", "dep:rustix"]

[[bin]]
name = "tuigui"
path = "src/main.rs"

[dependencies]
tui = { workspace = true }
gui = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
# Only the profiled build carries it: the one thing here that needs it is naming this process
# for the two listings, and a build without a profiler has no second listing to tell apart.
log = { workspace = true, optional = true }
# `prctl(PR_SET_NAME)`: the kernel's name for this process, which a process list shows.
rustix = { workspace = true, features = ["thread"], optional = true }
